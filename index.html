<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Brain 3D</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#05060d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#05060d;--fg:#e8ecff;--mut:#9aa3cc;--panel:rgba(12,14,30,.74);--line:rgba(140,160,255,.28)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 18% 12%,rgba(125,70,255,.5),transparent 70%),radial-gradient(55% 45% at 88% 28%,rgba(0,205,255,.32),transparent 70%),radial-gradient(70% 55% at 50% 104%,rgba(255,70,175,.38),transparent 70%),radial-gradient(40% 35% at 8% 78%,rgba(60,255,170,.18),transparent 70%),#05060d;animation:hue 70s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;z-index:1;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#top{position:fixed;left:0;right:0;top:0;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.02em}
#top p{margin:3px 0 0;font-size:13px;color:var(--mut)}
#hint{position:fixed;z-index:2;left:50%;top:46%;transform:translate(-50%,-50%);width:min(64vw,250px);text-align:center;font-size:14px;line-height:1.45;color:#d6dcff;pointer-events:none;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
#dock{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px}
#card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#card[hidden]{display:none}
#cf{font-size:13px;font-weight:600}
#ct{font-size:17px;margin-top:2px;overflow-wrap:anywhere}
#cl{font-size:12px;color:var(--mut)}
#cr{display:flex;gap:8px;margin-top:8px}
#cb,#cd{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600}
#cb{background:linear-gradient(135deg,#ff9a4f,#ff5fd2);color:#05060d}
#cd{background:rgba(255,255,255,.08);color:var(--fg)}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chip.on{background:var(--fg);color:#05060d;border-color:var(--fg)}
#add{display:flex;gap:8px}
#in{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:12px 14px;font:inherit;font-size:16px;outline:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#in:focus{border-color:#8fb0ff}
#go{border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;background:linear-gradient(135deg,#4fe3ff,#a07bff);color:#05060d}
#lt{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:7;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#list{position:fixed;left:0;top:0;bottom:0;width:min(80vw,330px);z-index:6;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:rgba(8,10,24,.88);border-right:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateX(-105%);transition:transform .55s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 60px rgba(124,156,255,.15)}
#list.open{transform:none}
#lh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#q{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:11px 13px;font:inherit;font-size:16px;outline:none}
#q:focus{border-color:#8fb0ff}
#lc{font-size:12px;color:var(--mut);white-space:nowrap}
#ul{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
#ul li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.035);cursor:pointer;transition:transform .25s,background .25s,border-color .25s,box-shadow .25s}
#ul li.empty{color:var(--mut);font-size:14px;cursor:default}
@media (hover:hover){#ul li:hover{transform:translateX(5px);background:rgba(255,255,255,.08)}}
#ul li.sel{border-color:var(--c);background:rgba(255,255,255,.09);box-shadow:0 0 18px -2px var(--c),inset 0 0 18px -8px var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px 2px var(--c);flex:none}
li.sel .dot{animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.55)}}
.tx{min-width:0;flex:1}
.tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--mut);font-size:12px}
#list.open #ul li{animation:fly .55s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*35ms)}
@keyframes fly{from{opacity:0;transform:translateX(-36px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (min-width:760px){#list{top:92px;bottom:212px;left:12px;width:300px;border:1px solid var(--line);border-radius:18px;padding-top:12px}}
@media (prefers-reduced-motion:reduce){#list.open #ul li,#bg,#hint{animation:none}#list{transition:none}}
h1{background:linear-gradient(90deg,#7ffcff,#ff8fe0,#ffd88f,#7ffcff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
#card{border-color:var(--cc,var(--line));box-shadow:0 0 28px -8px var(--cc,transparent),inset 0 0 24px -14px var(--cc,transparent);transition:box-shadow .4s,border-color .4s}
#ce,#cp{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);color:var(--fg)}
#mv{display:flex;align-items:center;gap:8px;margin-top:10px}
.mvb{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:0 0 10px var(--c);padding:0}
.mvb.on{border-color:#fff}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
.rb{position:fixed;right:14px;z-index:7;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:16px;padding:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#sp{top:calc(env(safe-area-inset-top,0px) + 58px)}
#sx{top:calc(env(safe-area-inset-top,0px) + 104px)}
#ctx{position:fixed;z-index:20;min-width:160px;padding:6px;border-radius:14px;background:rgba(14,16,34,.93);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px -8px rgba(124,156,255,.4);animation:pop .18s cubic-bezier(.2,.9,.2,1)}
#ctx[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(-6px)}}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;font-size:15px;padding:11px 14px;border-radius:10px}
#ctx button:hover,#ctx button:active{background:rgba(255,255,255,.1)}
#ctx .danger{color:#ff7a9a}
#ul li,#stage{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#ul li.pin{border-color:rgba(255,226,122,.45);background:linear-gradient(90deg,rgba(255,226,122,.14),rgba(255,255,255,.035))}
#ul li.pin.sel{border-color:var(--c)}
#fed{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#fed[hidden]{display:none}
#fsh{width:min(100%,420px);margin:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);padding:16px;border-radius:20px;background:rgba(14,16,34,.96);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.9,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
#fsh h2{margin:0 0 12px;font-size:18px;font-weight:600}
#fn{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:12px 14px;font:inherit;font-size:16px;outline:none}
#fn:focus{border-color:#8fb0ff}
#fsw{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
#fsw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0;transition:transform .2s}
#fsw button.on{border-color:#fff;transform:scale(1.12)}
#fcl{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--mut)}
#fc{width:56px;height:34px;border:0;background:none;padding:0}
#fbt{display:flex;gap:8px;margin-top:16px}
#fbt button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;font-size:15px;background:rgba(255,255,255,.08);color:var(--fg)}
#fbt #fok{background:linear-gradient(135deg,#4fe3ff,#a07bff);color:#05060d}
#fbt #fx{color:#ff7a9a}
.chip.plus{font-size:18px;line-height:1;padding:6px 15px;border-style:dashed}
.chip i{width:11px;height:11px}
#mv{flex-wrap:wrap}
#chips{overflow-y:hidden;padding:8px 4px 4px;-webkit-user-select:none;user-select:none}
#chips .chip{transition:transform .22s cubic-bezier(.2,.9,.2,1);-webkit-touch-callout:none}
#chips .chip.drag{position:relative;z-index:5;transition:none;box-shadow:0 0 24px rgba(160,190,255,.8);background:var(--fg);color:#05060d}
.lb{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);border-radius:10px;width:36px;height:40px;font-size:15px;padding:0}
#set{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#set[hidden]{display:none}
#ssh{width:min(100%,460px);max-height:86vh;overflow-y:auto;margin:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);padding:16px;border-radius:20px;background:rgba(14,16,34,.97);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.9,.2,1)}
#ssh h2{margin:0 0 6px;font-size:18px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row>span{flex:none}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px}
.seg button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.seg button.on{background:var(--fg);color:#05060d;border-color:var(--fg)}
.row input[type=range]{flex:1;max-width:210px;accent-color:#8fb0ff}
.btns{flex-wrap:wrap;justify-content:flex-start;border-bottom:0}
.btns button{flex:1;min-width:104px;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:600;font-size:14px;background:rgba(255,255,255,.08);color:var(--fg)}
.btns .pri{background:linear-gradient(135deg,#4fe3ff,#a07bff);color:#05060d}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,10px);z-index:40;padding:9px 16px;border-radius:999px;background:rgba(14,16,34,.95);color:#e8ecff;border:1px solid var(--line);font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#zn{top:calc(env(safe-area-inset-top,0px) + 150px)}
body.zen #dock,body.zen #top,body.zen #list,body.zen #lt,body.zen #sp,body.zen #sx,body.zen #hint{opacity:0;pointer-events:none}
body.light{--bg:#eaeeff;--fg:#14183a;--mut:#555d8a;--panel:rgba(255,255,255,.84);--line:rgba(60,70,140,.3)}
body.light #bg{background:radial-gradient(60% 50% at 18% 12%,rgba(150,120,255,.45),transparent 70%),radial-gradient(55% 45% at 88% 28%,rgba(0,190,255,.3),transparent 70%),radial-gradient(70% 55% at 50% 104%,rgba(255,110,190,.35),transparent 70%),#f3f5ff}
body.light #stage canvas{filter:invert(1) hue-rotate(180deg) saturate(1.3)}
body.light #hint{color:#2b3060}
body.light #list,body.light #ctx,body.light #fsh,body.light #ssh{background:rgba(248,249,255,.96)}
body.light #ul li,body.light .lb,body.light .seg button,body.light #cd,body.light #ce,body.light #cp,body.light #fbt button,body.light .btns button{background:rgba(20,30,90,.07)}
body.light .seg button.on,body.light .chip.on,body.light #chips .chip.drag{background:var(--fg);color:#fff}
body.light #ctx button:hover{background:rgba(20,30,90,.08)}
body.light #fbt #fok,body.light .btns .pri{color:#05060d}
body.light #toast{background:rgba(255,255,255,.96);color:#14183a}
#bg{background:radial-gradient(120% 90% at 50% 40%,#080a14 0%,#04050c 55%,#010207 100%);animation:none}
#fm{position:fixed;z-index:25;width:min(250px,86vw);max-height:62vh;overflow-y:auto;padding:6px;border-radius:16px;background:rgba(14,16,34,.96);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .18s cubic-bezier(.2,.9,.2,1)}
#fm[hidden]{display:none}
#fm .mh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:10px 12px 4px}
#fm button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;font-size:15px;padding:9px 12px;border-radius:10px}
#fm button:hover,#fm button:active{background:rgba(255,255,255,.1)}
#fm button.on{background:rgba(255,255,255,.08)}
#fm i{width:10px;height:10px;border-radius:50%;background:var(--c,#8fa4ff);box-shadow:0 0 8px var(--c,#8fa4ff);flex:none}
#fm i.nd{background:transparent;box-shadow:none;border:1px solid var(--mut)}
#fm span{flex:1}
#fm em{font-style:normal;color:#8fb0ff}
#crow{display:flex;gap:6px;align-items:center}
#crow #chips{flex:1;min-width:0}
#fb{flex:none;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.light #fm{background:rgba(248,249,255,.97)}
#bk{position:fixed;inset:0;z-index:35;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bk[hidden]{display:none}
#bsh{width:min(100%,480px);max-height:88vh;overflow-y:auto;margin:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);padding:16px;border-radius:20px;background:rgba(14,16,34,.97);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.9,.2,1)}
#bsh h2{margin:0 0 4px;font-size:18px;font-weight:600}
#bsh h3{margin:16px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
#bsh p{margin:0 0 8px;font-size:13px;color:var(--mut);line-height:1.4}
#bsh textarea{width:100%;height:92px;resize:none;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:10px 12px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;outline:none}
#bsh textarea:focus{border-color:#8fb0ff}
.brow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.brow button{flex:1;min-width:96px;border:0;border-radius:12px;padding:11px;font:inherit;font-weight:600;font-size:14px;background:rgba(255,255,255,.08);color:var(--fg)}
.brow .pri{background:linear-gradient(135deg,#4fe3ff,#a07bff);color:#05060d}
.snap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.snap small{display:block;color:var(--mut)}
.snap button{border:0;border-radius:10px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;background:rgba(255,255,255,.08);color:var(--fg)}
.binfo,#bmsg{font-size:13px;margin-top:6px;min-height:16px;color:var(--mut)}
.binfo.ok,#bmsg.ok{color:#8fe3b0}
.binfo.err,#bmsg.err{color:#ff7a9a}
body.light #bsh{background:rgba(248,249,255,.97)}
body.light .brow button,body.light .snap button{background:rgba(20,30,90,.07)}
.ico{width:18px;height:18px;display:inline-block;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:currentColor;stroke:none}
.rb{display:flex;align-items:center;justify-content:center}
.rb .ico{width:20px;height:20px}
.lb{display:flex;align-items:center;justify-content:center}
#ul .ico{width:16px;height:16px;flex:none}
#rm{position:fixed;inset:0;z-index:36;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#rm[hidden]{display:none}
#rsh{width:min(100%,420px);margin:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);padding:16px;border-radius:20px;background:rgba(14,16,34,.97);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.9,.2,1)}
#rsh h2{margin:0 0 4px;font-size:18px;font-weight:600}
#rsh p{margin:0 0 10px;font-size:14px;color:var(--mut);overflow-wrap:anywhere}
#rmi{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:12px 14px;font:inherit;font-size:16px;color-scheme:dark;outline:none}
#rmi:focus{border-color:#8fb0ff}
#rhd{display:flex;gap:8px;align-items:stretch;margin:2px 0 10px}
#rhd button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);border-radius:12px;font:inherit}
#rdb{flex:1;font-size:14px;padding:8px 10px;text-align:left}
#rtb{display:flex;align-items:center;gap:2px;font-size:30px;font-weight:600}
#rtb button{font-size:30px;font-weight:600;padding:2px 10px;min-width:62px}
#rhd button.on{background:linear-gradient(135deg,#4fe3ff,#a07bff);color:#05060d;border-color:transparent}
#rcl[hidden],#rck[hidden]{display:none}
#rcl .cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600;font-size:15px}
#rcl .cn button{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--fg);font-size:22px;font-family:inherit}
#rcl .cn button:disabled{opacity:.25}
#rcl .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
#rcl .gr i{font-style:normal;font-size:11px;color:var(--mut);padding:4px 0}
#rcl .gr button{height:38px;border:0;border-radius:50%;background:none;color:var(--fg);font:inherit;font-size:15px}
#rcl .gr button:disabled{opacity:.25}
#rcl .gr button.td{box-shadow:inset 0 0 0 1px #8fb0ff}
#rcl .gr button.on{background:linear-gradient(135deg,#4fe3ff,#a07bff);color:#05060d;font-weight:700}
#rck{display:flex;justify-content:center}
#rks{width:240px;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#rcal{width:100%;margin-top:4px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--fg);border-radius:12px;padding:12px;font:inherit;font-weight:600;font-size:15px}
body.light #rhd button,body.light #rcl .cn button,body.light #rcal{background:rgba(20,30,90,.07)}
body.light #rhd button.on{background:linear-gradient(135deg,#4fe3ff,#a07bff)}
#rmq{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
